<style>
  :root{

    --cyan:#37e0e6; --blue:#4c8dff; --gold:#f5b64e; --green:#39d98a; --red:#ff6b7a; --violet:#9b8cff;
    --glow:0 0 24px rgba(55,224,230,.15);
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 78% -8%,#16233f 0,var(--bg) 55%);

  a{color:var(--cyan);text-decoration:none}
  .app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
  /* sidebar */
  .sidebar{border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#0d1526,#0a1020)}

  .brand .row1{display:flex;align-items:center;gap:8px;white-space:nowrap}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:var(--glow);flex:none}
  .brand small{display:block;color:var(--dim2);font-weight:500;font-size:11px;margin-top:3px;letter-spacing:0}
  .nav{margin-top:18px;display:flex;flex-direction:column;gap:2px}
  .nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--dim);font-weight:600;font-size:13px}
  .nav button:hover{background:#16233f;color:var(--ink)}
  .nav button.on{background:linear-gradient(90deg,rgba(76,141,255,.22),rgba(55,224,230,.08));color:#fff;box-shadow:inset 0 0 0 1px var(--line)}
  .nav button .em{width:18px;text-align:center}
  .nav .stargroup button.on{background:linear-gradient(90deg,rgba(245,182,78,.24),rgba(245,182,78,.05));box-shadow:inset 0 0 0 1px rgba(245,182,78,.35)}
  .navtag{font-size:9px;background:var(--gold);color:#231a04;padding:1px 5px;border-radius:6px;font-weight:800;margin-left:auto}
  .demoflag{margin-top:22px;font-size:11px;color:var(--dim2);border-top:1px dashed var(--line);padding-top:12px}
  .demoflag b{color:var(--gold)}
  /* main */
  .main{padding:26px 34px 60px;max-width:1120px}
  h1{font-size:22px;margin:0 0 2px}
  .sub{color:var(--dim);margin:0 0 22px;font-size:13px}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .kpi .n{font-size:26px;font-weight:800;letter-spacing:.5px}
  .kpi .l{color:var(--dim);font-size:12px;margin-top:2px}
  .kpi .d{font-size:11px;margin-top:6px}
  .up{color:var(--green)} .down{color:var(--red)}
  .sect{font-weight:800;font-size:15px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
  .pill.hot{color:var(--gold);border-color:rgba(245,182,78,.4)}
  .pill.acq{color:var(--cyan);border-color:rgba(55,224,230,.4)}
  .pill.vio{color:var(--violet);border-color:rgba(155,140,255,.4)}
  .pill.fan{color:var(--blue);border-color:rgba(76,141,255,.4)}
  .pill.ok{color:var(--green);border-color:rgba(57,217,138,.4)}
  .muted{color:var(--dim)}
  .small{font-size:12px}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--dim2);font-weight:600;font-size:12px}
  .btn{all:unset;cursor:pointer;background:linear-gradient(90deg,var(--blue),var(--cyan));color:#04121f;font-weight:800;
    padding:9px 16px;border-radius:10px;font-size:13px;display:inline-flex;gap:7px;align-items:center}
  .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
  .btn.gold{background:linear-gradient(90deg,var(--gold),#ffcf7a);color:#241900}
  .btn:active{transform:translateY(1px)}
  input,select,textarea{background:#0b1322;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 11px;font:inherit;width:100%}
  label{font-size:12px;color:var(--dim);display:block;margin:10px 0 4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  /* avatar */
  .ava{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:#0b1322;flex:none}
  .ava.sm{width:22px;height:22px;vertical-align:middle;margin-right:7px}
  /* score card */
  .sc{border:1px solid var(--line);border-radius:14px;padding:15px 16px;background:var(--panel2)}
  .sc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .sc .top>div:first-child{min-width:0;flex:1;display:flex;gap:10px;align-items:flex-start}
  .sc .score{font-size:28px;font-weight:800;line-height:1;flex:none}
  .sc .score small{font-size:12px;color:var(--dim);font-weight:600}
  .sc .title{font-weight:700;font-size:14px;margin-bottom:2px;overflow-wrap:anywhere}
  .reasons{margin-top:12px;display:flex;flex-direction:column;gap:5px}
  .reason{display:flex;align-items:center;gap:8px;font-size:11px}
  .reason .bar{height:6px;border-radius:4px;background:#1b2740;flex:1;overflow:hidden;min-width:40px}
  .reason .bar i{display:block;height:100%;border-radius:4px}
  .reason .v{width:98px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums;flex:none}
  .reason .k{width:70px;color:var(--dim);flex:none}
  .verdict{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--dim)}
  .tag{font-size:11px;padding:2px 8px;border-radius:7px;background:#16233f;color:var(--dim)}
  /* loop wheel */
  .wheel{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
  .node{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:var(--panel2);position:relative}
  .node .e{font-size:20px} .node .t{font-weight:700;font-size:13px;margin-top:3px} .node .d{font-size:11px;color:var(--dim2)}
  .node.star{border-color:rgba(245,182,78,.5);box-shadow:0 0 22px rgba(245,182,78,.12)}
  .node.star .t{color:var(--gold)}
  /* calibration */
  .cal .weights{display:flex;flex-direction:column;gap:10px}
  .wrow{display:grid;grid-template-columns:96px 1fr 110px;align-items:center;gap:10px}
  .wbar{height:22px;background:#0b1322;border-radius:7px;overflow:hidden;position:relative}
  .wbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}
  .wbar .old{position:absolute;top:0;bottom:0;border-right:2px dashed var(--gold);opacity:.9}
  .delta{font-variant-numeric:tabular-nums;font-size:12px}
  .maechart{display:flex;align-items:flex-end;gap:10px;height:120px;padding:8px 4px;border-bottom:1px solid var(--line)}
  .maechart .b{width:44px;background:linear-gradient(180deg,var(--cyan),var(--blue));border-radius:6px 6px 0 0;position:relative}
  .maechart .b span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim)}
  .maechart .b em{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--dim2);font-style:normal;white-space:nowrap}
  .note{background:rgba(76,141,255,.08);border:1px solid rgba(76,141,255,.25);border-radius:10px;padding:11px 13px;font-size:12px;color:#bcd0f5;margin-top:14px}
  .warn{background:rgba(245,182,78,.08);border-color:rgba(245,182,78,.3);color:#f3d9a6}
  .flash{animation:fl .8s ease}@keyframes fl{0%{background:rgba(55,224,230,.15)}100%{background:transparent}}
  code{background:#0b1322;padding:1px 6px;border-radius:5px;color:var(--cyan);font-size:12px}

  @media(max-width:1100px){.grid3{grid-template-columns:1fr 1fr}.wheel{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:860px){
    .app{grid-template-columns:1fr}
    .sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
    .grid2,.grid3{grid-template-columns:1fr}
    .kpis{grid-template-columns:1fr 1fr}
    .main{padding:20px 16px 50px}

/* ================= 指标(全部现场从 POOL 算,不写死) ================= */
function poolMetrics(w){
  const scored=POOL.map(r=>({s:r[0]*w.sem/100 + r[1]*w.sweet/100 + r[2]*w.pov/100, p:r[3]}));
  scored.sort((a,b)=>b.s-a.s);
  const n=scored.length, pcts=[];
  scored.forEach((x,i)=>{if(x.p)pcts.push((i+1)/n*100)});
  pcts.sort((a,b)=>a-b);
  const m=pcts.length%2 ? pcts[(pcts.length-1)/2] : (pcts[pcts.length/2-1]+pcts[pcts.length/2])/2;
  return {median:+m.toFixed(1), top5:pcts.filter(p=>p<=5).length, top20:pcts.filter(p=>p<=20).length, total:pcts.length};
}
let rw={sem:70,sweet:18,pov:12};
const rw0={...rw};
let rHist=[poolMetrics(rw)], rConverged=false;

/* 一步校准(带护栏的爬山):在「从信号A挪一点权重给信号B」的所有走法里,
   只接受 让正例中位百分位下降 且 前5%召回不减少 的最优一步。
   没有可接受的走法 → 收敛停止。单调、白盒、可复现。 */
function rCalStep(){
  if(rConverged) return;
  const cur=rHist[rHist.length-1], keys=["sem","sweet","pov"];
  let best=null;
  for(const d of [5,2,1]) for(const a of keys) for(const b of keys){
    if(a===b || rw[a]-d<0) continue;
    const w={...rw}; w[a]=+(w[a]-d).toFixed(1); w[b]=+(w[b]+d).toFixed(1);
    const m=poolMetrics(w);
    if(m.median < cur.median-1e-9 && m.top5 >= cur.top5 &&
       (!best || m.median<best.m.median || (m.median===best.m.median && m.top5>best.m.top5)))
      best={w,m};
  }
  if(!best){rConverged=true;return;}
  rw=best.w; rHist.push(best.m);
}
function rReset(){rw={...rw0};rHist=[poolMetrics(rw)];rConverged=false;renderView();}

const fmtSubs=v=>v==null?"—":v>=1e6?(v/1e6).toFixed(1).replace(/\.0$/,"")+"M":v>=1e3?Math.round(v/1e3)+"k":v;
const ava=(c,cls)=>`<img class="ava${cls?' '+cls:''}" src="avatars/r${c.rank}.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`;

function radarCard(c){
  const total=(c.score*100).toFixed(1);
  const col=c.pct<=5?"var(--green)":c.pct<=20?"var(--gold)":"var(--red)";
  const badge=c.pos
    ? `<span class="pill acq">✅ 已验证影石合作 · ${c.src==="star"?"官方大使/专访":"中腰部赞助"}</span>`
    : `<span class="pill fan">🆕 引擎新发现</span>`;
  const reasons=RDIMS.map(d=>({k:d.name,raw:c[d.k],w:d.w,contrib:+(c[d.k]*d.w).toFixed(1)})).sort((a,b)=>b.contrib-a.contrib);
  return `<div class="sc">
    <div class="top">
      <div>${ava(c)}<div style="min-width:0"><div class="title"><a href="${c.url}" target="_blank">${c.n}</a></div>
        <div class="small muted">${badge}<br><span class="tag" style="margin-top:4px;display:inline-block">订阅 ${fmtSubs(c.subs)}</span></div></div></div>
      <div class="score" style="color:${col}">${total}<small>/100</small></div>
    </div>
    <div class="reasons">${reasons.map(r=>`
      <div class="reason"><span class="k">${r.k}</span>
        <div class="bar"><i style="width:${Math.min(100,r.contrib*1.9)}%;background:${col}"></i></div>
        <span class="v">${r.raw.toFixed(2)}×${r.w}%=${r.contrib}</span></div>`).join("")}</div>
    <div class="verdict">全池排名 <b>#${c.rank}</b> / ${POOL.length} · 前 ${c.pct}%</div>
  </div>`;
}

function kpiStrip(){
  const m0=poolMetrics(rw0);

}

  <div class="sect">🆕 引擎交出的第一页(盲测排名前三的新面孔)</div>
  <div class="grid3">${fresh.map(radarCard).join("")}</div>
  <div class="note">工作流骨架学自 engine.zcchr.com(飞书 AI 绝活大会展示),我们只取对影石命题有用的两环(回流+自进化);选题/文案/素材那些内容生产模块与本命题无关,不放进来。</div>`;
}

function view_radar(){
  const hits=RADAR.filter(c=>c.pos&&c.pct<=5).sort((a,b)=>a.rank-b.rank);
  const fresh=RADAR.filter(c=>!c.pos).sort((a,b)=>a.rank-b.rank).slice(0,6);
  const rows=[...RADAR].sort((a,b)=>a.rank-b.rank).map(c=>{
    const col=c.pct<=5?"var(--green)":c.pct<=20?"var(--gold)":"var(--dim)";
    return `<tr${c.pos?' style="background:rgba(57,217,138,.05)"':''}>
      <td class="delta">#${c.rank}</td>
      <td>${ava(c,"sm")}<a href="${c.url}" target="_blank">${c.n}</a></td>
      <td>${fmtSubs(c.subs)}</td>
      <td class="delta">${c.sem.toFixed(2)}</td><td class="delta">${c.sweet.toFixed(2)}</td><td class="delta">${c.pov.toFixed(2)}</td>
      <td class="delta" style="color:${col};font-weight:700">${(c.score*100).toFixed(1)}</td>
      <td class="small">${c.pos?(c.src==="star"?"✅ 大使/专访":"✅ 中腰部赞助"):"🆕 新发现"}</td></tr>`;}).join("");
  return `<h1>🎯 达人雷达 <span class="pill ok">全部真数据 · 回测 v1.2 口径</span></h1>
  <p class="sub">数据来自 7/6–7/7 的真实盲测回测:1,106 个全球摩托/骑行 YouTube 频道(公开元数据+本地 embedding,零 API 成本),26 个已验证影石合作达人当标准答案,打分时把一切品牌痕迹剔除。</p>
  ${kpiStrip()}
  <div class="sect">✅ 盲测命中:引擎在看不到任何合作痕迹时,把这 6 个真实合作达人排进了前 5%</div>
  <div class="grid3">${hits.map(radarCard).join("")}</div>
  <div class="sect">🆕 引擎交出的第一页:如果影石今天就用它,推荐的新面孔</div>
  <div class="grid3">${fresh.map(radarCard).join("")}</div>
  <div class="sect">📋 完整榜单(前 20 名 + 全部 26 个正例,绿底 = 已验证合作)</div>
  <div class="card tablewrap"><table>
    <tr><th>排名</th><th>频道</th><th>订阅</th><th>语义</th><th>甜点</th><th>POV</th><th>总分</th><th>身份</th></tr>${rows}</table>
    <div class="note" style="margin-top:14px"><b>巨星沉底是设计使然:</b>Fabio Wibmer(804万粉)排 92.9%、Casey Neistat(1270万)排 99.2%。中腰部甜点函数刻意压制巨星 —— "发现下一个"的引擎不该把预算指向人尽皆知的人。这也顺带证明引擎没有在"认名人"。</div>
  </div>`;
}

function view_data(){
  const rows=RADAR.filter(c=>c.pos).sort((a,b)=>a.rank-b.rank).map(c=>{
    const verdict=c.pct<=5?['命中前 5%','ok']:c.pct<=20?['前 20%','hot']:(c.subs>=1e6?['沉底(巨星,设计使然)','vio']:['中后段,需深层信号','fan']);
    return `<tr>
      <td>${ava(c,"sm")}<a href="${c.url}" target="_blank">${c.n}</a></td>
      <td>${fmtSubs(c.subs)}</td>
      <td class="small">${c.src==="star"?"官方大使/专访":"中腰部赞助"}</td>
      <td class="delta">#${c.rank} · 前 ${c.pct}%</td>
      <td><span class="pill ${verdict[1]}">${verdict[0]}</span></td></tr>`;}).join("");
  return `<h1>📊 数据回流</h1>
  <p class="sub">闭环的燃料:推荐出去的达人,合作后效果如何,要回来对答案。demo 里的回流信号 = 26 个已验证影石合作(公开赞助声明/官方公告),真实部署换成投放后的转化数据,机制一样。</p>
  <div class="card tablewrap"><table>
    <tr><th>已验证合作达人</th><th>订阅</th><th>合作证据层</th><th>引擎盲测排名</th><th>对答案</th></tr>${rows}</table>
    <div class="note" style="margin-top:16px">读法:绿色=引擎凭内容特征就该抓到、也真抓到了的人;蓝色=元数据(标题/简介/订阅)只够把他们排到中后段,需要互动率/成长斜率等深层信号才能浮起 —— 这正是 Phase 1 要加的维度;紫色=巨星,甜点函数刻意压的,不是失误。</div>
    <div class="note warn">这张「预判 vs 实际」对照表,就是 🔁 自进化页的输入。没有回流,打分器永远停在第一天的水平。</div>
  </div>`;
}

function view_evolve(){
  const m0=rHist[0], mNow=rHist[rHist.length-1];
  const maxM=Math.max(...rHist.map(h=>h.median),1);
  const bars=rHist.map((h,i)=>`<div class="b" style="height:${Math.max(10,h.median/maxM*100)}%"><span>${h.median}%</span><em>${i===0?'初始':'第'+i+'轮'}</em></div>`).join("");
  const wrows=RDIMS.map(d=>{
    const now=rw[d.k], old=rw0[d.k], dd=+(now-old).toFixed(1);
    return `<div class="wrow">
      <div title="${d.desc}">${d.name}</div>
      <div class="wbar"><i style="width:${now}%"></i><div class="old" style="left:${old}%"></div></div>
      <div class="delta">${now}% <span style="color:${dd>0?'var(--green)':dd<0?'var(--red)':'var(--dim2)'}">(${dd>0?'+':''}${dd})</span></div>
    </div>`;}).join("");
  return `<h1>🔁 自进化 <span class="pill" style="color:var(--gold);border-color:rgba(245,182,78,.5)">在 1,106 条真数据上现场跑</span></h1>
  <p class="sub">把回流信号喂回打分器:系统自己试探权重方向,<b>只接受「正例中位百分位下降 且 前5%召回不减少」的移动</b>(带护栏的爬山)。单调、白盒、每一步可复现。</p>

  <div class="grid2">
    <div class="card cal">
      <div class="sect" style="margin:0 0 14px">① 正例中位百分位,每校准一轮下降(越低=真实合作达人越靠前)</div>
      <div class="maechart">${bars}</div>
      <div style="margin-top:26px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="btn gold" onclick="rCalStep();renderView();">▶ 运行一轮自进化校准</button>
        <button class="btn ghost" onclick="rReset()">重置</button>
        <span class="muted small">${m0.median}% → ${mNow.median}%${rConverged?' · ✔ 已收敛':''} · 前5%召回 ${mNow.top5}/${mNow.total} 保持</span>
      </div>
    </div>
    <div class="card cal">
      <div class="sect" style="margin:0 0 14px">② 权重变化(金色虚线=初始,蓝条=现在)</div>
      <div class="weights">${wrows}</div>
      <div class="note" style="margin-top:14px">校准结果不回写 🎯 达人雷达页(那边锁定回测 v1.2 口径);真实产品里,校准后的权重滚动生效到下一轮推荐。</div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="sect" style="margin:0 0 10px">③ 这次跑通学到的最值钱的一课:自进化必须带护栏</div>
    <div class="small" style="color:#bcd0f5">我们先试过"纯优化中位百分位"的版本:系统会把 POV 权重清零、中位数一路降到 22%,看着更漂亮 —— 但前 5% 召回从 6 跌到 4,<b>头部推荐质量被牺牲了</b>。对"发现下一个"的业务,榜单头部就是产品本身。所以正式版校准加了护栏:任何一步不允许前 5% 召回下降。</div>
    <div class="note warn" style="margin-top:12px"><b>诚实边界:</b>demo 的回流信号是「已验证合作」标签,在同一批标签上校准+评估存在过拟合风险;真实部署的回流信号是投放后的转化数据,且要用时间滚动验证(用签约前数据预测、签约后数据校验)。机制相同,这页演示的是机制。</div>
  </div>`;
}

function view_set(){
  const c=getCfg();
  return `<h1>设置 / 接入</h1><p class="sub">大模型是可选的:接入后用于对前 100 名做精读重排、生成推荐卡的人话推荐语。Key 只存你本机浏览器,不上传。</p>
  <div class="card grid2">
    <div><label>API 地址(OpenAI 兼容 /chat/completions)</label><input id="c_base" value="${c.base||''}" placeholder="https://api.xxx.com/v1/chat/completions"></div>
    <div><label>模型名</label><input id="c_model" value="${c.model||''}" placeholder="gpt-4o-mini / deepseek-chat …"></div>
    <div><label>API Key</label><input id="c_key" type="password" value="${c.key||''}" placeholder="sk-…（仅存 localStorage）"></div>
    <div style="display:flex;align-items:flex-end"><button class="btn" onclick="saveCfg()">保存</button></div>
  </div>
  <div class="note">
    <b>数据源接入路线(诚实版):</b><br>
    · Demo/本次跑通 → 公开元数据采集(仅用于验证,PPT 注明)<br>
    · 正式交付影石 → YouTube Data API / 星图 / 巨量开放平台 / RSS 企业源,<b>绝不上 cookie 爬</b><br>
    · 打分引擎、可解释卡、自进化闭环 → 与数据源解耦,换源不改核心<br>
    · 落地形态 → 飞书多维表格存达人池,侧边栏插件一键批量打分,推荐卡发飞书群
  </div>`;
}

function getCfg(){try{return JSON.parse(localStorage.getItem("ge-cfg")||"{}")}catch(e){return{}}}
function saveCfg(){localStorage.setItem("ge-cfg",JSON.stringify({
  base:val("c_base"),model:val("c_model"),key:val("c_key")}));renderView();}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():"";};

function renderView(){
  const v={home:view_home,radar:view_radar,data:view_data,evolve:view_evolve,set:view_set}[cur];
  const el=document.getElementById("view");el.innerHTML=v();el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");
}
/* hash 路由:#radar / #evolve 可直达(方便分享/收藏) */
const h=location.hash.replace("#","");
if(NAV.some(x=>x.id===h)) cur=h;
renderNav();renderView();
</script>
