/* ================= 打分引擎(白盒,可解释) ================= */
function scoreWith(dim, w){
  const total = DIMS.reduce((s,d)=>s + dim[d.k]*(w[d.k]/100), 0);
  const reasons = DIMS.map(d=>({
    k:d.name, raw:dim[d.k], w:w[d.k],
    contrib:+(dim[d.k]*(w[d.k]/100)).toFixed(1)
  })).sort((a,b)=>b.contrib-a.contrib);
  return {score:Math.round(total), reasons};
}
/* MAE:预判分与实测分的平均绝对误差(越小=系统越懂什么会火) */
function mae(w){
  const e = posts.map(p=>Math.abs(scoreWith(p.dim,w).score - p.actual));
  return +(e.reduce((a,b)=>a+b,0)/e.length).toFixed(1);
}
/* 皮尔逊相关:某维度原始分 与 真实表现 的相关度 */
function corr(key){
  const xs=posts.map(p=>p.dim[key]), ys=posts.map(p=>p.actual), n=xs.length;
  const mx=xs.reduce((a,b)=>a+b)/n, my=ys.reduce((a,b)=>a+b)/n;
  let num=0,dx=0,dy=0;
  for(let i=0;i<n;i++){num+=(xs[i]-mx)*(ys[i]-my);dx+=(xs[i]-mx)**2;dy+=(ys[i]-my)**2;}
  return num/Math.sqrt(dx*dy||1);
}
/* 一步校准:把权重朝「相关度隐含的目标权重」挪 50%(可反复点,逐步收敛) */
let maeHistory = [mae(weights)];
function calibrateStep(){
  const prev={...weights}, prevMae=maeHistory[maeHistory.length-1];
  const c={}; let sum=0;
  DIMS.forEach(d=>{const v=Math.max(0,corr(d.k)); c[d.k]=v; sum+=v;});
  const target={}; DIMS.forEach(d=>target[d.k]= sum? +(c[d.k]/sum*100).toFixed(1):weights[d.k]);
  DIMS.forEach(d=>{weights[d.k]= +(weights[d.k] + 0.5*(target[d.k]-weights[d.k])).toFixed(1);});
  // 归一化到 100
  const s=DIMS.reduce((a,d)=>a+weights[d.k],0);
  DIMS.forEach(d=>weights[d.k]=+(weights[d.k]/s*100).toFixed(1));
  const m=mae(weights);
  if(m > prevMae + 0.05){ weights=prev; return; } // 已到最优,不接受更差的一步(保证单调下降)
  maeHistory.push(m);
}

  return `<h1>🎯 达人雷达 <span class="pill" style="color:var(--green);border-color:rgba(57,217,138,.5)">影石命题 · 全部真数据</span></h1>
  <p class="sub">这一页不是种子样本。数据来自 7/6–7/7 的真实盲测回测:1,106 个全球摩托/骑行 YouTube 频道(公开元数据+本地 embedding,零 API 成本),26 个已验证影石合作达人当标准答案,打分时把一切品牌痕迹剔除。同一套「白盒打分 + 可解释卡」,对象从选题换成达人。</p>
  <div class="kpis">
    <div class="card kpi"><div class="n">1,106</div><div class="l">真实频道池</div><div class="d">55+ 个多语言搜索词采集</div></div>
    <div class="card kpi"><div class="n">26</div><div class="l">已验证合作正例</div><div class="d">盲测时隐藏,防泄漏</div></div>
    <div class="card kpi"><div class="n" style="color:var(--green)">4.6×</div><div class="l">前 5% 召回 vs 随机</div><div class="d up">23% 召回,随机基线 5%</div></div>
    <div class="card kpi"><div class="n" style="color:var(--gold)">28.5%</div><div class="l">正例中位百分位</div><div class="d">随机应为 50%</div></div>
  </div>
  <div class="sect">✅ 盲测命中:引擎在看不到任何合作痕迹时,把这 6 个真实合作达人排进了前 5%</div>
  <div class="grid3">${hits.map(radarCard).join("")}</div>
  <div class="sect">🆕 引擎交出的第一页:如果影石今天就用它,推荐的新面孔</div>
  <div class="grid3">${fresh.map(radarCard).join("")}</div>
  <div class="sect">📋 完整榜单(前 20 名 + 全部 26 个正例,绿底 = 已验证合作)</div>
  <div class="card" style="overflow-x:auto"><table>
    <tr><th>排名</th><th>频道</th><th>订阅</th><th>语义</th><th>甜点</th><th>POV</th><th>总分</th><th>身份</th></tr>${rows}</table>
    <div class="note" style="margin-top:14px"><b>巨星沉底是设计使然:</b>Fabio Wibmer(804万粉)排 92.9%、Casey Neistat(1270万)排 99.2%。中腰部甜点函数刻意压制巨星 —— "发现下一个"的引擎不该把预算指向人尽皆知的人。这也顺带证明引擎没有在"认名人"。</div>
    <div class="note warn" style="margin-top:10px"><b>和自进化闭环的接口:</b>这套权重(70/18/12)目前是手工设定的。把「签约后实际转化」当实测分回流,🔁 自进化页那套校准机制原样搬过来,权重就能像内容侧一样被数据自动纠偏 —— 这是 Phase 1 要做的事。数据源 demo 用公开元数据,正式交付走 YouTube Data API。</div>
  </div>`;
}

  const cfg=getCfg();
  return `<h1>文案工坊</h1><p class="sub">选一个选题一键出四类文案:视频口播 / 图文 / 公众号 / 朋友圈,定稿后学你的风格。</p>

      <button class="btn" onclick="genCopy()">✨ 生成四类文案</button>
      <span class="muted small">${cfg.key?'已接入大模型:'+ (cfg.model||'') :'未接大模型 → 用本地模板降级(接入见「设置」页)'}</span>

  const c=getCfg();
  return `<h1>设置 / 接入</h1><p class="sub">大模型是可选的:不填就用本地模板降级,填了文案/热点筛选就走真模型。Key 只存你本机浏览器,不上传。</p>

  </div>
  <div class="note">

    · 正式交付影石 → YouTube Data API / 星图 / 巨量开放平台 / RSS 企业源,<b>绝不上 cookie 爬</b><br>

/* ---------- 可选大模型(降级安全) ---------- */
function getCfg(){try{return JSON.parse(localStorage.getItem("ge-cfg")||"{}")}catch(e){return{}}}
function saveCfg(){localStorage.setItem("ge-cfg",JSON.stringify({
  base:val("c_base"),model:val("c_model"),key:val("c_key")}));renderView();}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():"";};
async function genCopy(){
  const t=topics[+document.getElementById("tpick").value];const cfg=getCfg();const out=document.getElementById("copyout");
  out.innerHTML='<span class="muted small">生成中…</span>';
  const kinds=[["🎬 视频口播","3秒钩子+痛点+方法+行动"],["📕 图文","小红书体,标题党+分点"],["💚 公众号","稍长,有观点"],["💬 朋友圈","一句话+悬念"]];
  if(!cfg.key){ // 本地模板降级
    out.innerHTML=kinds.map(k=>`<div class="sc" style="margin-bottom:10px"><b>${k[0]}</b>
      <div class="small muted" style="margin-top:6px">【${t.t}】· ${k[1]}<br>(本地模板占位。接入大模型后这里出真文案。)</div></div>`).join("");return;
  }
  try{
    const res=await fetch(cfg.base,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.key},
      body:JSON.stringify({model:cfg.model||"gpt-4o-mini",messages:[{role:"user",
        content:`我的人设:${persona.who}。请就选题「${t.t}」写四类文案,分别是:视频口播脚本、小红书图文、公众号短文、朋友圈一句话。简洁,带钩子。`}]})});
    const d=await res.json();out.innerHTML=`<div class="sc"><div class="small" style="white-space:pre-wrap">${(d.choices?.[0]?.message?.content||JSON.stringify(d)).replace(/</g,"&lt;")}</div></div>`;
  }catch(e){out.innerHTML=`<div class="note warn">调用失败:${e.message}。检查「设置」里的地址/Key。</div>`;}
}

function renderView(){
  const v={home:view_home,topic:view_topic,radar:view_radar,copy:view_copy,asset:view_asset,data:view_data,evolve:view_evolve,set:view_set}[cur];
  const el=document.getElementById("view");el.innerHTML=v();el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");
}
/* hash 路由:#radar 可直达达人雷达页(方便分享/收藏) */
const h=location.hash.replace("#","");
if(NAV.some(x=>x.id===h)) cur=h;
renderNav();renderView();
</script>
